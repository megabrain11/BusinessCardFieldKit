name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Repository checks
        run: Scripts/check-repository.sh
