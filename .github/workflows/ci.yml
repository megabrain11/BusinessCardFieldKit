name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    # Golden-scene and barcode-evidence expectations are calibrated on the macOS 26 Vision runtime.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Show toolchain
        run: sw_vers && swift --version
      - name: Ensure ripgrep for repository checks
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Repository checks
        run: Scripts/check-repository.sh
