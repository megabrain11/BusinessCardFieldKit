name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: Ensure ripgrep for repository checks
        run: command -v rg >/dev/null 2>&1 || brew install ripgrep
      - name: Repository checks
        run: Scripts/check-repository.sh
