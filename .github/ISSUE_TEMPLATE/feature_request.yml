name: Feature request
description: Propose a scoped package capability using fictional or sanitized examples only.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Do not attach real cards, OCR output, personal details, credentials, or private data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only fictional or sanitized data and reviewed every attachment.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the reusable interpretation-layer problem, not a private host feature.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed capability
      description: Explain the smallest change that would solve the problem.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Architecture and privacy boundaries
      description: Note contract, determinism, platform, storage, networking, or privacy impact.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include host-side approaches that do not require a package change.
