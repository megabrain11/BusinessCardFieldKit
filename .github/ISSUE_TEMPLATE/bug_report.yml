name: Bug report
description: Report a reproducible classification or package problem using synthetic data only.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not attach real cards, OCR output, personal details, credentials, or private correction files.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only fictional or sanitized data and reviewed every attachment.
          required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Explain the result and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Use placeholders, reserved domains, or clearly fictional values.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and rule versions
    validations:
      required: true
