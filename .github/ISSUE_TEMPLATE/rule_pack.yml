name: Rule-pack proposal
description: Propose a sanitized locale or industry vocabulary improvement.
title: "[Rule pack]: "
labels: ["rules"]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This proposal contains no real card, OCR output, or personal contact value.
          required: true
  - type: input
    id: scope
    attributes:
      label: Locale or industry scope
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Proposed terms and field mapping
    validations:
      required: true
  - type: textarea
    id: regressions
    attributes:
      label: Synthetic positive and false-promotion cases
    validations:
      required: true
